name: Portfolio CI/CD and quality tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright UI and API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI and API tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: k6 performance smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke test against the official site
        run: k6 run tests/performance/buger-eats.js

      - name: Upload k6 performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-evidence
          path: |
            k6-summary.md
            k6-summary.json
            k6-raw.json
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy portfolio to GitHub Pages
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      needs.test.result == 'success'
    needs:
      - test
      - performance
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Playwright HTML report
        if: needs.test.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: portfolio/playwright-report

      - name: Download latest successful k6 report
        if: needs.performance.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: k6-performance-evidence
          path: portfolio/evidence

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload portfolio site
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio

      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
